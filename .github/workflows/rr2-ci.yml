name: RR2 CI

# All hosted jobs are repository-only, without a physical RIFT installation,
# local captures, game credentials or deployment.
on:
  pull_request:
    branches:
      - codex/modular-foundation
  push:
    branches:
      - codex/modular-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rr2-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  QT_QPA_PLATFORM: offscreen

jobs:
  navigation:
    name: Navigation / Windows
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Fast navigation regression lanes
        run: python -B scripts/validate_cloud_navigation.py --lane all --jobs 3

  portable:
    name: Progress / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Verify portable progress and feedback tests
        run: python -B scripts/validate_cloud_navigation.py --lane progress
      - name: Check repository links
        run: python -B scripts/check_repository_links.py
      - name: Check committed whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git diff --check HEAD^ HEAD
          fi

  windows:
    name: Full offline gate / Windows
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: 'requirements-*.txt'
      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements-validation.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Existing authoritative offline validation
        shell: pwsh
        run: |
          ./scripts/validate.ps1 -LuaPython (Get-Command python).Source -DotNet (Get-Command dotnet).Source

  required:
    name: RR2 required gate
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    needs: [navigation, portable, windows]
    if: always()
    env:
      NAVIGATION: ${{ needs.navigation.result }}
      PORTABLE: ${{ needs.portable.result }}
      WINDOWS: ${{ needs.windows.result }}
    steps:
      - name: Require every offline job to succeed
        shell: bash
        run: |
          set -euo pipefail
          printf 'Navigation: %s\nPortable: %s\nWindows: %s\n' "$NAVIGATION" "$PORTABLE" "$WINDOWS"
          [[ "$NAVIGATION" == success && "$PORTABLE" == success && "$WINDOWS" == success ]]
